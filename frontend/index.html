<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary Meta Tags ──────────────────────────────────────────────── -->
    <title>TFI_CONNECTS — Telugu Film Industry Movie Search Platform</title>
    <meta name="title" content="TFI_CONNECTS — Telugu Film Industry Movie Search Platform" />
    <meta name="description" content="Discover, track, and explore Telugu movies with TFI_CONNECTS. Find box office collections, ratings, celebrity profiles, trending films and more." />
    <meta name="keywords" content="Telugu movies, TFI, Tollywood, movie search, box office, Telugu cinema, Telugu film industry" />
    <meta name="author" content="TFI_CONNECTS" />
    <meta name="robots" content="index, follow" />

    <!-- ── Favicon & PWA ──────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <meta name="theme-color" content="#e50914" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TFI_CONNECTS" />

    <!-- ── Open Graph / Facebook ──────────────────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://tfi-connects.vercel.app/" />
    <meta property="og:title"       content="TFI_CONNECTS — Telugu Film Industry Movie Search Platform" />
    <meta property="og:description" content="Discover, track, and explore Telugu movies with TFI_CONNECTS. Box office, ratings, celebrity profiles, trending films and more." />
    <meta property="og:image"       content="https://tfi-connects.vercel.app/hero-bg.jpg" />
    <meta property="og:site_name"   content="TFI_CONNECTS" />
    <meta property="og:locale"      content="en_US" />

    <!-- ── Twitter Card ───────────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:url"         content="https://tfi-connects.vercel.app/" />
    <meta name="twitter:title"       content="TFI_CONNECTS — Telugu Film Industry" />
    <meta name="twitter:description" content="Discover, track, and explore Telugu movies with TFI_CONNECTS." />
    <meta name="twitter:image"       content="https://tfi-connects.vercel.app/hero-bg.jpg" />

    <!-- ── Performance: DNS prefetch for external domains ────────────────── -->
    <link rel="dns-prefetch"   href="https://api.themoviedb.org" />
    <link rel="dns-prefetch"   href="https://image.tmdb.org" />
    <link rel="dns-prefetch"   href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch"   href="https://fonts.gstatic.com" />

    <!-- ── Google Fonts: Inter + Outfit (loaded efficiently) ─────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..700&family=Outfit:wght@300..800&display=swap"
      rel="stylesheet"
    />

    <!-- ── Structured Data (JSON-LD) ─────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TFI_CONNECTS",
      "description": "Telugu Film Industry Movie Search Platform",
      "url": "https://tfi-connects.vercel.app",
      "applicationCategory": "EntertainmentApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
